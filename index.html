<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'; img-src 'none'">
<title>Divino Encanto · Vinculación</title>
<style>
 body{font:16px system-ui,-apple-system,sans-serif;line-height:1.55;max-width:42rem;margin:5rem auto;padding:0 1rem;color:#18212b}
 h1{font-size:1.55rem} button{font:inherit;background:#1459c4;color:white;border:0;border-radius:.5rem;padding:.85rem 1.2rem;cursor:pointer}
 button:disabled{opacity:.5;cursor:default}.info{color:#526070}.success{color:#116f3e}.error{color:#af1235}
</style>
<script>
'use strict';
const query = new URLSearchParams(location.search);
const authorizationCode = query.get('code') || '';
const authorizationState = query.get('state') || '';
const authorizationError = query.get('error') || '';
history.replaceState(null, '', location.pathname);
function setup(){
  const status = document.getElementById('status');
  const button = document.getElementById('copy');
  if (authorizationError || !authorizationCode || !authorizationState){
    status.className='error';
    status.textContent='No se recibió una autorización válida. Inicia nuevamente desde Terminal.';
    return;
  }
  status.textContent='Autorización recibida. Copia CODE y STATE juntos con el botón, y pégalos SOLO en la ventana privada de tu Mac.';
  button.hidden=false;
}
function fallbackCopy(text){
  const t=document.createElement('textarea');
  t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.left='-10000px';
  document.body.appendChild(t);t.focus();t.select();
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){ok=false;}
  t.remove();return ok;
}
async function copyAuthorization(){
  const status=document.getElementById('status');
  const payload=JSON.stringify({v:1,code:authorizationCode,state:authorizationState});
  let success=false;
  try{
    if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(payload); success=true;}
  }catch(e){success=false;}
  if(!success){success=fallbackCopy(payload);}
  if(success){
    status.className='success';
    status.textContent='COPIADO. Regresa a Terminal y pega UNA SOLA VEZ en la ventana privada. No compartas estos datos.';
  }else{
    status.className='error';
    status.textContent='No se pudo copiar. Usa Safari o Chrome actualizado y vuelve a pulsar el botón. No continúes sin ver COPIADO.';
  }
}
window.addEventListener('DOMContentLoaded',setup);
</script>
</head>
<body>
<h1>Divino Encanto · Vinculación segura v5.5</h1>
<p id="status" class="info">Comprobando la autorización...</p>
<button id="copy" hidden onclick="copyAuthorization()">Copiar autorización completa</button>
<p class="info">Esta página solo se utiliza para el retorno de OAuth. No pegues el contenido del portapapeles en chats ni lo compartas con nadie.</p>
</body>
</html>
